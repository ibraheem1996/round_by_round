name: round_by_round
description: "Workout tracking, round by round."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  injectable: ^3.0.0
  go_router: ^18.1.4
  firebase_core: ^5.2.0
  cloud_firestore: ^7.2.0
  firebase_auth: ^7.1.0
  google_sign_in: ^7.2.0
  intl: ^0.20.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  # Newer runners conflict with injectable_generator (build/lean_builder analyzer constraints).
  build_runner: 2.16.1
  injectable_generator: ^3.1.3
  freezed: ^4.0.3
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true
